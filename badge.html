<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Streamers met een Hart-badge</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.7rem 1.4rem 0.7rem 0.9rem;
    border-radius: 999px;
    background: rgba(13, 40, 26, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
  }

  .frog-wrap {
    position: relative;
    width: 3rem;
    height: 3rem;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frog-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(143, 240, 184, 0.45), transparent 70%);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .frog {
    position: relative;
    font-size: 2rem;
    animation: bob 1.6s ease-in-out infinite;
  }

  .tekst {
    color: #fff;
    line-height: 1.25;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }
  .tekst .klein {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #C9F2D8;
    text-transform: uppercase;
  }
  .tekst .groot {
    display: block;
    font-size: 1.15rem;
    font-weight: 800;
  }
  .tekst .groot .accent {
    color: #8FF0B8;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-6px) rotate(6deg); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.9); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .frog, .frog-wrap::before { animation: none; }
  }
</style>
</head>
<body>
  <div class="badge">
    <div class="frog-wrap"><div class="frog">🐸</div></div>
    <div class="tekst">
      <span class="klein">Ik zet me deze maand in voor</span>
      <span class="groot">Stichting <span class="accent">Opkikker</span>! 💚</span>
    </div>
  </div>
</body>
</html>
